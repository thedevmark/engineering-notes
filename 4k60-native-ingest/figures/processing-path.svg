<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="228" viewBox="0 0 1180 228" role="img" aria-labelledby="title desc">
  <title id="title">Video upload processing stages</title>
  <desc id="desc">A 4K60 source file goes through native iPhone app preparation, platform encoding, and viewer playback selection. Meta documents the latter three stages for Instagram.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #405360; }
      .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #657b89; }
      .main { font-size: 18px; font-weight: 700; fill: #fff; }
      .frame { fill: #fff; stroke: #bccbd3; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .slate { fill: #657b89; }
      .arrow { fill: none; stroke: #7a8d98; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a8d98"/>
    </marker>
  </defs>
  <rect width="1180" height="228" fill="#fff"/>
  <rect x="48" y="29" width="250" height="170" rx="14" class="frame"/>
  <text x="66" y="61" class="stage">01  SOURCE</text>
  <rect x="66" y="83" width="214" height="83" rx="9" class="slate"/>
  <text x="173" y="132" text-anchor="middle" class="main">4K/60 FILE</text>

  <path d="M298 124 H323" class="arrow"/>
  <rect x="326" y="29" width="250" height="170" rx="14" class="frame"/>
  <text x="344" y="61" class="stage">02  IPHONE APP</text>
  <rect x="344" y="83" width="214" height="83" rx="9" class="slate"/>
  <text x="451" y="132" text-anchor="middle" class="main">LOCAL PREP</text>

  <path d="M576 124 H601" class="arrow"/>
  <rect x="604" y="29" width="250" height="170" rx="14" class="frame"/>
  <text x="622" y="61" class="stage">03  PLATFORM</text>
  <rect x="622" y="83" width="214" height="83" rx="9" class="slate"/>
  <text x="729" y="132" text-anchor="middle" class="main">NEW ENCODES</text>

  <path d="M854 124 H879" class="arrow"/>
  <rect x="882" y="29" width="250" height="170" rx="14" class="frame"/>
  <text x="900" y="61" class="stage">04  VIEWER</text>
  <rect x="900" y="83" width="214" height="83" rx="9" fill="#a9eae4"/>
  <text x="1007" y="132" text-anchor="middle" class="main" style="fill:#405360">PLAYBACK</text>
</svg>
